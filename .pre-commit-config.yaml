repos:

  # Standard hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-docstring-first
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-xml
  - id: check-yaml
    args: [--allow-multiple-documents]
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace
    exclude_types: [rst]

  # YAML Formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2', --offset, '0']

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v22.1.8
  hooks:
  - id: clang-format
    name: Clang Format
    args: [--style=file]
    files: \.(cpp|hpp|h|c|cc)$

- repo: local
  hooks:
  - id: cppcheck
    name: Cppcheck
    entry: cppcheck --force --quiet --language=c++
    language: system
    types: [c, c++]
    files: \.(cpp|hpp|h|c|cc)$

- repo: https://github.com/psf/black
  rev: 26.5.1
  hooks:
  - id: black
    name: Black
    language_version: python3

    # Package XML
- repo: https://github.com/Joschi3/package_xml_validation.git
  rev: v1.8.0
  hooks:
  - id: format-package-xml
    name: Validate and Format package.xml

  # Yaml launch and config files
- repo: https://github.com/Joschi3/launch_config_validator.git
  rev: v0.5.1
  hooks:
  - id: format-yaml-launch-and-configs
    name: Validate ROS2 launch and config YAML files

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.0
  hooks:
  - id: check-github-workflows
    args: [--verbose]
