detection_aggregator:

  visualization_topic:
    type: string
    default_value: "aggregated_detections"
    description: "Topic where the visualizations of aggregated detections are published to."

  cam_topic:
    type: string
    default_value: "camera/image_raw"
    description: Camera topic name all detections are extracted from.

  use_thermal:
    type: bool
    default_value: false
    description: Whether to use thermal images for detection aggregation.

  thermal_topic:
    type: string
    default_value: ""
    description: Topic where thermal images are published.
  
  use_april:
    type: bool
    default_value: false
    description: Whether to use april tag detections for detection aggregation.
  
  use_hazmat:
    type: bool
    default_value: false
    description: Whether to use hazmat detections for detection aggregation.
  
  use_qr:
    type: bool
    default_value: true
    description: Whether to use QR detections for detection aggregation.

  object_detection_topic:
    type: string
    default_value: ""
    description: Topic where object detections are published. This includes hazmats, apriltags, and QR codes.

  use_motion:
    type: bool
    default_value: false
    description: Whether to use motion detections for detection aggregation.
  
  motion_topic:
    type: string
    default_value: ""
    description: Topic where motion detections are published.

  buffer_size:
    type: int
    default_value: 20
    description: Maximum amount of stored messages per detection type by time sync buffers.

  debug:
    type: bool
    default_value: false
    description: Whether node is in debug mode.
