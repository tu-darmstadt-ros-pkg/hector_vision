launch:
- arg:
    name: image_transport
    default: compressed
    description: Mode of image transport for the input topic
- arg:
    name: input_topic
    default: /athena/gripper_rgbd/color/image_raw/$(var image_transport)
    description: From which topic the input image should be received
- arg:
    name: output_topic
    default: detection/visual_detection
    description: To which topic the detections should be sent
- node:
    pkg: hector_motion_detection
    exec: motion_detection
    param:
    - name: motion_detect_activation_threshold
      value: 50
    - name: motion_detect_automatic_learning_rate
      value: false
    - name: motion_detect_max_area
      value: 5000
    - name: motion_detect_min_area
      value: 20
    - name: image_transport
      value: $(var image_transport)
    remap:
    - from: /image/$(var image_transport)
      to: $(var input_topic)
    - from: detection/image_detection
      to: $(var output_topic)
