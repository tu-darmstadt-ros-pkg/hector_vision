launch:
- arg:
    name: "image_dir"
    default: "$(find-pkg-share hector_vision_test)/images"
- arg:
    name: "image_frequency"
    default: "0.2"
- arg:
    name: "image_frames"
    default: "5"
    
- node:
    pkg: "hector_vision_test"
    exec: "camera_dummy_node"
    param:
      - name: "image_dir"
        value: "$(var image_dir)"
      - name: "image_frequency"
        value: "$(var image_frequency)"
      - name: "image_frames"
        value: "$(var image_frames)"

- node:
    pkg: "hector_tag_detection"
    exec: "tag_detection"
    remap:
    - from: "perception/image_percept"
      to: "detection/visual_detection"

- node:
    pkg: "rqt_image_view"
    exec: "rqt_image_view"
